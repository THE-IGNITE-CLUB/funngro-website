<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Funngro</title>
  <script>
    // SPA redirect: GitHub Pages serves 404.html for unknown routes.
    // Store the path and redirect to index.html which handles routing.
    var path = window.location.pathname;
    var repo = '/funngro-website';
    var route = path.replace(repo, '') || '/';
    sessionStorage.setItem('spa_redirect', route + window.location.search);
    window.location.replace(repo + '/');
  </script>
</head>
<body></body>
</html>
